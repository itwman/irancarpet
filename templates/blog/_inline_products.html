{% load fa %}<aside class="inline-recs" aria-label="فرش‌های مرتبط">
  <p class="inline-recs__t">فرش‌های مرتبط با این مطلب</p>
  <div class="inline-recs__row">{% for p in products %}<a href="{{ p.get_absolute_url }}">{% if p.image %}<img src="{{ p.image|thumb:240 }}" alt="{{ p.title }}" loading="lazy" width="96" height="128">{% endif %}<span>{{ p.title|fa_num }}</span>{% if p.min_price %}<small>از {{ p.min_price|toman }} تومان</small>{% endif %}</a>{% endfor %}</div>
</aside>
