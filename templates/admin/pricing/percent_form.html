{% extends "admin/base_site.html" %}
{% block content %}
<form method="post">{% csrf_token %}
  <p>آلبوم‌های انتخاب‌شده:</p>
  <ul>{% for a in albums %}<li>{{ a.name }}<input type="hidden" name="_selected_action" value="{{ a.pk }}"></li>{% endfor %}</ul>
  {{ form.as_p }}
  <input type="hidden" name="action" value="adjust_percent">
  <button type="submit" name="apply" value="1" class="bg-primary-600 text-white px-4 py-2 rounded">اعمال</button>
</form>
{% endblock %}
