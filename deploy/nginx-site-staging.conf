# نسخهٔ آزمایشی سایت دوم (رمزدار و noindex) — از روی این الگو با deploy/setup_site.sh ساخته می‌شود
server {
    listen 80;
    server_name __DOMAIN__;

    auth_basic "__NAME__ staging";
    auth_basic_user_file /etc/nginx/.htpasswd-__NAME__;
    add_header X-Robots-Tag "noindex, nofollow" always;
    client_max_body_size 20m;

    location /static/ { alias __APP__/staticfiles/; expires 30d; access_log off; }
    location = /favicon.ico { alias __APP__/staticfiles/img/favicon.ico; access_log off; }
    location /wp-content/uploads/ {
        alias __MEDIA__/;
        expires 30d; access_log off;
        location ~ \.(php|phtml|phar)$ { deny all; }
    }
    location / {
        proxy_pass http://unix:/run/__NAME__/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
