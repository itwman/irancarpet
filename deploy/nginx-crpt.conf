# پیوند کوتاه همکاران فروش: crpt.it/<کد>[/<شمارهٔ فرش>] ← irancarpet.net با ?ref=
# نصب و گواهی SSL خودکار:  bash deploy/setup_crpt.sh
server {
    listen 80;
    server_name crpt.it www.crpt.it;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / {
        proxy_pass http://unix:/run/irancarpet/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 20s;
    }
}
