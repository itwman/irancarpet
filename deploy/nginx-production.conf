# روز سوییچ: جایگزین بلاک فعلی irancarpet.net (گواهی SSL همان قبلی می‌ماند)
server {
    listen 443 ssl http2;
    server_name irancarpet.net;
    # ssl_certificate و ssl_certificate_key: همان خطوط فعلی بلاک وردپرس را اینجا کپی کنید

    client_max_body_size 20m;

    location /static/ {
        alias /var/www/irancarpet-django/staticfiles/;
        expires 30d;
        access_log off;
    }
    location /wp-content/uploads/ {
        alias /var/www/irancarpet/public_html/wp-content/uploads/;
        expires 30d;
        access_log off;
        location ~ \.(php|phtml|phar)$ { deny all; }
    }
    # فایل‌های قدیمی که باید بمانند (تأیید گوگل، اینماد، favicon)
    location ~ ^/(google[0-9a-f]+\.html|enamad\.html|favicon\.ico|locations\.kml)$ {
        root /var/www/irancarpet/legacy-root;
    }
    location / {
        proxy_pass http://unix:/run/irancarpet/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
server {
    listen 443 ssl http2;
    server_name www.irancarpet.net;
    # ssl_certificate ... (همان قبلی)
    return 301 https://irancarpet.net$request_uri;
}
server {
    listen 80;
    server_name irancarpet.net www.irancarpet.net;
    return 301 https://irancarpet.net$request_uri;
}
