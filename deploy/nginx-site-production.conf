# سایت دوم روی دامنهٔ اصلی — با deploy/switch_site.sh ساخته می‌شود؛ certbot بعداً بلاک 443 را اضافه می‌کند
server {
    listen 80;
    server_name __DOMAIN__ www.__DOMAIN__;
    client_max_body_size 20m;

    location /static/ { alias __APP__/staticfiles/; expires 30d; access_log off; }
    location = /favicon.ico { alias __APP__/staticfiles/img/favicon.ico; access_log off; }
    location /wp-content/uploads/ {
        alias __MEDIA__/;
        expires 30d; access_log off;
        location ~ \.(php|phtml|phar)$ { deny all; }
    }
    location / {
        if ($host = www.__DOMAIN__) { return 301 https://__DOMAIN__$request_uri; }
        proxy_pass http://unix:/run/__NAME__/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
