# /etc/nginx/sites-available/new.irancarpet.net — نسخهٔ آزمایشی (رمزدار و noindex)
server {
    listen 80;
    server_name new.irancarpet.net;

    auth_basic "IranCarpet staging";
    auth_basic_user_file /etc/nginx/.htpasswd-irancarpet;
    add_header X-Robots-Tag "noindex, nofollow" always;

    client_max_body_size 20m;

    location /static/ {
        alias /var/www/irancarpet-django/staticfiles/;
        expires 30d;
    }
    # تصاویر از همان پوشهٔ uploads وردپرس و با همان آدرس قبلی
    location /wp-content/uploads/ {
        alias /var/www/irancarpet/public_html/wp-content/uploads/;
        expires 30d;
        location ~ \.(php|phtml|phar)$ { deny all; }
    }
    location / {
        proxy_pass http://unix:/run/irancarpet/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
