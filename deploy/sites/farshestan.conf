# تنظیمات نصب فرشستان روی همین کد (deploy/setup_site.sh farshestan)
NAME=farshestan
DOMAIN=farshestan.ir
STAGING_DOMAIN=new.farshestan.ir
THEME=farshestan
BRAND="فرشستان"
# دیتابیس وردپرس قبلی (فقط برای ایمپورت)
WP_SQL=/opt/migration/irancarpet_farshestan.sql
WP_DB=farshestan_wp
WP_PREFIX=wp_
# عکس‌های وردپرس که از هاست قبلی گرفته شد
MEDIA_SRC=/opt/migration/farshestan/media/uploads
# بخش‌هایی از کد ایران کارپت که روی فرشستان خاموش‌اند (بعداً از پنل ← تنظیمات سایت قابل تغییر)
FEATURES_OFF="affiliate market finder farshplus torob manix"
WORKERS=2
